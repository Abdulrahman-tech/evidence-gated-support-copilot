name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: support_copilot_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_USER: support_copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support_copilot -d support_copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      TEST_POSTGRES_DSN: postgresql://support_copilot:test-only-password@127.0.0.1:5432/support_copilot_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install application
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile release entry points
        run: >-
          python -m py_compile
          src/support_copilot/api.py
          src/support_copilot/github_review.py
          scripts/apply_medusa_development_source_fidelity.py
          scripts/backup_review_database.py
          scripts/build_medusa_development_source_fidelity.py
          scripts/calibrate_medusa_retrieval_confidence.py
          scripts/check_kubernetes_production_readiness.py
          scripts/check_live_service.py
          scripts/create_api_key_secret.py
          scripts/evaluate_hosted_evidence.py
          scripts/load_test_api.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Audit locked runtime dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --require-hashes --disable-pip -r requirements.lock

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository content for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"
          # The generated, checksum-verified official corpus contains example
          # JWTs and Docker config values from Kubernetes documentation.
          skip-files: data/kubernetes/knowledge.json

  container:
    name: Non-root container
    runs-on: ubuntu-latest
    needs: [tests, dependency-audit, secret-scan]
    steps:
      - uses: actions/checkout@v7
      - name: Build production-shaped image
        run: docker build --pull -t evidence-gated-support-copilot:ci .
      - name: Verify runtime user and healthcheck
        run: |
          test "$(docker image inspect evidence-gated-support-copilot:ci --format '{{.Config.User}}')" = "app"
          test "$(docker image inspect evidence-gated-support-copilot:ci --format '{{json .Config.Healthcheck.Test}}')" != "null"
      - name: Scan image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: evidence-gated-support-copilot:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"

  release-readiness:
    name: Manual production release gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: container
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application
        run: python -m pip install --require-hashes -r requirements-test.lock
      - name: Evaluate the locked release benchmark
        run: >-
          python scripts/check_kubernetes_production_readiness.py
          --include-locked-test
