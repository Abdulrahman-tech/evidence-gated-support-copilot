name: Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application
        run: python -m pip install '.[test]'
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile release entry points
        run: >-
          python -m py_compile
          src/support_copilot/api.py
          scripts/check_kubernetes_production_readiness.py
          scripts/create_api_key_secret.py

  container:
    name: Non-root container
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - name: Build production-shaped image
        run: docker build -t evidence-gated-support-copilot:ci .
      - name: Verify runtime user and healthcheck
        run: |
          test "$(docker image inspect evidence-gated-support-copilot:ci --format '{{.Config.User}}')" = "app"
          test "$(docker image inspect evidence-gated-support-copilot:ci --format '{{json .Config.Healthcheck.Test}}')" != "null"

  release-readiness:
    name: Manual production release gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: container
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application
        run: python -m pip install '.[test]'
      - name: Evaluate the locked release benchmark
        run: >-
          python scripts/check_kubernetes_production_readiness.py
          --include-locked-test
