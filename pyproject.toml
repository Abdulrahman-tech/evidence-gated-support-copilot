[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-gated-support-copilot"
version = "0.1.0"
description = "Evidence-gated support drafting for developer-tool companies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]
groq = [
    "groq>=0.31,<2",
]
openai = [
    "openai>=1.68,<3",
]
semantic = [
    "numpy>=1.26,<3",
    "sentence-transformers>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
